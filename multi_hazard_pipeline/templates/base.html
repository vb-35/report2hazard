<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Multi-hazard review{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header><nav class="site-nav" aria-label="Main">
    <a class="brand" href="{{ url_for('index') }}">Multi-hazard review</a>
    {% set endpoint = request.endpoint or '' %}
    <a href="{{ url_for('index') }}"{% if endpoint == 'index' %} aria-current="page"{% endif %}>Reports</a>
    <a href="{{ url_for('new_localization') }}"{% if endpoint in ['new_localization', 'start_provided_localization'] %} aria-current="page"{% endif %}>Localization test</a>
  </nav></header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Local single-process review tool. One pipeline task runs at a time.</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
